name: orca-kernel-smoke
services:
  orca:
    image: orca-kernel-smoke:1.4.188
    build:
      context: ./docker
      additional_contexts:
        orca_asset: ${ORCA_ARTIFACT_DIR:?Set to the isolated v1.4.188 download directory}
    platform: linux/amd64
    user: "1000:1000"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,mode=1777
    volumes:
      - smoke-home:/home/node
    shm_size: 256m
    mem_limit: 4g
    cpus: 4
    pids_limit: 512
    stop_grace_period: 30s
    restart: "no"
volumes:
  smoke-home:
